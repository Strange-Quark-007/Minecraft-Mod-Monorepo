# Important Notes:
# Any metadata field you add here can be registered in gradle/platform.gradle expandProps map.

# Project Defaults (overridden per-mod in mods/<mod>/gradle.properties)
version=1.0.0
group=com.example
java_version=25

# Minecraft & Common
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
mod_author=Strange Quark
mod_name=Mod
mod_id=mod
license=MIT
credits=
description=The description of your mod. \nAccepts multilines.

# NeoForm (used by Common to compile against vanilla MC)
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric Platform
# https://fabricmc.net/develop/
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.5

# NeoForge Platform
# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.1-beta
neoforge_loader_version_range=[4,)

# Gradle Daemon & Memory
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
